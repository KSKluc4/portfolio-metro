<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lucas Marques · Rede de projetos</title>
    <meta
      name="description"
      content="Portfólio de projetos de programação de Lucas Marques em forma de mapa de metrô: cada linha é uma linguagem e cada estação é um projeto."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#14213d" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@500;600;700;800&display=swap"
    />

    <script>
      // Aplica o tema antes de pintar a página (assim o modo noturno não pisca claro)
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('metro:theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <!-- Cabeçalho: a placa de estação com o nome -->
    <header class="topbar">
      <div class="plate">
        <svg class="plate__emblem" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <path class="plate__emblem-line" d="M3 26h12l12-12h10" />
          <circle class="plate__emblem-stop" cx="21" cy="20" r="8" />
        </svg>
        <div class="plate__text">
          <h1 class="plate__name" id="plate-name">Lucas Marques</h1>
          <p class="plate__sub" id="plate-sub">Rede de projetos</p>
        </div>
        <span class="plate__stripe" id="plate-stripe" aria-hidden="true"></span>
      </div>

      <p class="topbar__stats" id="stats"></p>

      <nav class="topbar__tools" aria-label="Links e preferências">
        <a class="tool" id="github-link" href="https://github.com/KSKluc4" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 15.5c-3.5 1-3.5-1.75-5-2M12.5 17.5v-2.9a2.5 2.5 0 0 0-.7-1.95c2.35-.26 4.7-1.15 4.7-5.2a4 4 0 0 0-1.1-2.8 3.75 3.75 0 0 0-.07-2.8s-.88-.26-2.88 1.08a9.9 9.9 0 0 0-5.2 0C5.25 1.6 4.37 1.86 4.37 1.86a3.75 3.75 0 0 0-.07 2.8 4 4 0 0 0-1.1 2.8c0 4.03 2.35 4.92 4.7 5.2a2.5 2.5 0 0 0-.7 1.92v2.92"/></svg>
          <span class="tool__label">GitHub</span>
        </a>
        <button class="tool" id="theme-btn" type="button" aria-pressed="false">
          <span class="tool__label">Modo noturno</span>
        </button>
      </nav>
    </header>

    <!-- O mapa -->
    <main class="map" id="map">
      <svg class="map__svg" id="map-svg" role="group" aria-labelledby="map-title" aria-describedby="map-help" tabindex="0">
        <title id="map-title">Mapa de metrô dos projetos</title>
        <g id="map-world"></g>
      </svg>
      <p class="sr-only" id="map-help">
        Cada estação é um projeto e cada linha, uma linguagem. Use Tab para ir de estação em estação e Enter para embarcar.
        Com o mapa em foco, as setas movem, mais e menos mudam o zoom e zero centraliza.
      </p>

      <div class="status" id="map-status" hidden></div>
      <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
      <p class="hint" id="hint" hidden></p>

      <aside class="legend" id="legend" aria-label="Legenda do mapa" hidden>
        <button class="legend__toggle" type="button" aria-expanded="true" aria-controls="legend-body">
          <span>Legenda</span>
        </button>
        <div class="legend__body" id="legend-body"></div>
      </aside>

      <div class="controls" role="group" aria-label="Zoom do mapa">
        <button class="controls__btn" type="button" data-zoom="in" aria-label="Aproximar" title="Aproximar (+)"></button>
        <button class="controls__btn" type="button" data-zoom="out" aria-label="Afastar" title="Afastar (−)"></button>
        <button class="controls__btn" type="button" data-zoom="fit" aria-label="Centralizar o mapa" title="Centralizar (0)"></button>
      </div>

      <!-- Painel da estação (lateral no computador, gaveta no celular) -->
      <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
        <div class="panel__grip" aria-hidden="true"><span></span></div>
        <button class="panel__close" type="button" aria-label="Fechar o painel (Esc)"></button>
        <div class="panel__body"></div>
      </aside>
    </main>

    <div class="sr-only" id="announcer" aria-live="polite"></div>

    <noscript>
      <p class="noscript">Este mapa precisa de JavaScript. Os projetos estão em <a href="https://github.com/KSKluc4">github.com/KSKluc4</a>.</p>
    </noscript>

    <script>
      // Aberto com dois cliques (file://)? Os módulos JS não carregam assim: avisa como rodar
      if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', () => {
          const status = document.getElementById('map-status');
          status.hidden = false;
          status.innerHTML =
            '<div class="status__box status__box--error" role="alert"><p><strong>Abra por um servidor local.</strong> ' +
            'No terminal, dentro da pasta do projeto: <code>python3 -m http.server 8000</code> e acesse ' +
            '<code>http://localhost:8000</code>.</p></div>';
        });
      }
    </script>
  </body>
</html>
